# 测试档：H2 内存库，MySQL 兼容模式
# 与生产共用同一份 db/schema.sql 和 db/data.sql，杜绝 SQL 分叉
spring.datasource.url=jdbc:h2:mem:admin_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 是嵌入式库，默认 EMBEDDED 也会执行；显式写 always 更确定
spring.sql.init.mode=always

# 分页方言切成 H2（H2 两种方言都吃，但按实际库配置更干净）
admin.mybatis.db-type=H2

admin.jwt.secret=unit-test-secret-key-must-be-at-least-32-bytes-long

# 测试关掉验证码，让既有登录用例无需带验证码即可通过
admin.captcha.enabled=false

# 测试关掉限流，避免大量登录调用触发阈值
admin.ratelimit.enabled=false

# 测试文件上传路径（使用 target 下的临时目录，不污染项目目录）
admin.upload.path=./target/test-upload

logging.level.com.example.admin=info
