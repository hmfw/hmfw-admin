spring.application.name=server
server.port=8080

# ==================== 数据源（H2 文件库） ====================
# 数据落在 ./data/admin.mv.db，重启不丢。
# 想彻底重置：停掉应用，删掉 data/ 目录，重新启动即可重建表并重新播种。
spring.datasource.url=jdbc:h2:file:./data/admin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# ==================== SQL 初始化 ====================
# schema.sql 用 CREATE TABLE IF NOT EXISTS、data.sql 用 MERGE，二者都是幂等的，
# 所以每次启动都会执行，但不会清空已有数据。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# ==================== MyBatis-Plus ====================
mybatis-plus.mapper-locations=classpath*:com/example/admin/**/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.admin.module
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
admin.mybatis.db-type=H2

# ==================== JWT ====================
# 密钥至少 32 字节，否则 jjwt 抛 WeakKeyException。上线前务必改掉。
admin.jwt.secret=admin-management-system-jwt-secret-key-change-me-in-production
admin.jwt.expire-minutes=120
admin.jwt.issuer=admin
admin.jwt.header=Authorization
# 不带尾随空格，代码里自行补
admin.jwt.prefix=Bearer

# ==================== 验证码 ====================
# 登录图形验证码开关；关掉则 /api/auth/captcha 返回 enabled=false，登录不校验验证码
admin.captcha.enabled=true
# 验证码有效期（秒）
admin.captcha.expire-seconds=120

# ==================== 限流 ====================
# 接口限流开关（@RateLimit 生效）；登录接口按 IP 限流防爆破
admin.ratelimit.enabled=true

# ==================== 文件上传 ====================
# 上传文件存储根目录（相对路径，相对于应用启动目录）
admin.upload.path=./data/upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==================== springdoc ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ==================== 日志 ====================
logging.level.com.example.admin=info
